[package]
name = "captionsmith"
version = "0.1.0"
description = "Add captions to any video — transcribed on your own machine."
authors = ["Chafic Charafeddine"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "captionsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
