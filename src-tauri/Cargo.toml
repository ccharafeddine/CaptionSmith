[package]
name = "captionsmith"
version = "2.0.0"
description = "Add captions to any video — transcribed on your own machine."
authors = ["Chafic Charafeddine"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "captionsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streaming model downloads (rustls = pure-Rust TLS, portable, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
