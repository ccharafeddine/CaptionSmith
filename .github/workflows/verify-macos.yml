name: Verify macOS burn-in (Intel slice)

# Manual check: download a published universal .dmg, extract its bundled ffmpeg,
# and burn captions in using its x86_64 slice via Rosetta 2 (`arch -x86_64`),
# which runs the actual Intel machine code. Confirms the Intel slice executes
# and that the ffmpeg is self-contained (no Homebrew dylib dependencies).
#
# (Runs on the arm64 runner + Rosetta rather than a macos-13 Intel runner, which
# GitHub has retired.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify"
        default: "v1.0.1"

jobs:
  intel-slice-burn-in:
    runs-on: macos-latest # arm64; we force the x86_64 slice under Rosetta
    steps:
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Download the universal .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "*universal.dmg" --output app.dmg
          ls -la app.dmg

      - name: Extract the app + sidecars
        run: |
          hdiutil attach app.dmg -mountpoint /Volumes/CS -nobrowse -quiet
          cp -R "$(find /Volumes/CS -maxdepth 1 -name '*.app' | head -1)" ./CaptionSmith.app
          hdiutil detach /Volumes/CS -quiet
          xattr -dr com.apple.quarantine ./CaptionSmith.app || true
          FF="$(find ./CaptionSmith.app -type f -name ffmpeg | head -1)"
          FP="$(find ./CaptionSmith.app -type f -name ffprobe | head -1)"
          echo "FF=$FF" >> "$GITHUB_ENV"
          echo "FP=$FP" >> "$GITHUB_ENV"
          echo "found: $FF"

      - name: Inspect (universal + no Homebrew deps)
        run: |
          echo "== lipo =="
          lipo -info "$FF"
          echo "== otool -L (must show no /opt/homebrew or /usr/local paths) =="
          otool -L "$FF"
          if otool -L "$FF" | grep -E "/opt/homebrew|/usr/local"; then
            echo "::error::ffmpeg has a Homebrew dylib dependency"; exit 1
          fi

      - name: Confirm the x86_64 slice runs
        run: |
          echo "ffmpeg x86_64 slice reports:"
          arch -x86_64 "$FF" -hide_banner -version | head -1

      - name: Burn captions in (x86_64 slice under Rosetta)
        run: |
          # A tiny test clip (built with the same x86_64 slice).
          arch -x86_64 "$FF" -hide_banner -y -f lavfi -i "testsrc=size=640x360:rate=30:duration=2" \
            -f lavfi -i "sine=frequency=440:duration=2" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest in.mp4
          # ASS matching the app's boxed style (BorderStyle 3; libass + CoreText
          # font resolution, no fontconfig).
          {
            echo "[Script Info]"
            echo "ScriptType: v4.00+"
            echo "PlayResX: 640"
            echo "PlayResY: 360"
            echo "[V4+ Styles]"
            echo "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding"
            echo "Style: Default,Arial,40,&H00FFFFFF,&H00FFFFFF,&H00000000,&H66000000,-1,0,0,0,100,100,0,0,3,9,0,2,20,20,40,1"
            echo "[Events]"
            echo "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
            echo "Dialogue: 0,0:00:00.00,0:00:02.00,Default,,0,0,0,,HELLO INTEL"
          } > captions.ass

          arch -x86_64 "$FF" -hide_banner -y -i in.mp4 -vf "ass=captions.ass" \
            -c:v libx264 -crf 18 -preset medium -c:a aac -b:a 192k captioned.mp4

          echo "== probe the output (x86_64 ffprobe) =="
          arch -x86_64 "$FP" -v error -show_entries stream=codec_name,codec_type,width,height \
            -of default=noprint_wrappers=1 captioned.mp4
          test -s captioned.mp4
          echo "OK: x86_64 (Intel) slice burned in captions."
