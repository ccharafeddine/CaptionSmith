name: Verify whisper Vulkan build (Windows)

# Manual check for item 4b. Proves the Vulkan SDK installs and fetch-whisper.sh
# produces BOTH the CPU and the GPU (Vulkan) whisper-cli sidecars on
# windows-latest before a release depends on them. The GPU binary is NOT run
# here: the runner has no GPU/Vulkan driver, so a successful `-DGGML_VULKAN=ON`
# build (CMake needs the SDK to configure + link) plus the binary existing IS the
# proof; the missing-runtime case is exactly what the app's CPU fallback covers.
on:
  workflow_dispatch:

jobs:
  build-whisper-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Installed Vulkan SDK at $sdk"

      # This check is about the binaries, not the model — stub it so
      # fetch-whisper.sh skips the ~148 MB download.
      - name: Skip the model download
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          : > src-tauri/resources/models/ggml-base.en.bin

      - name: Build whisper-cli (CPU + Vulkan)
        shell: bash
        run: bash scripts/fetch-whisper.sh

      - name: Confirm both sidecars built and the CPU one runs
        shell: bash
        run: |
          set -euo pipefail
          CPU="src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe"
          GPU="src-tauri/binaries/whisper-cli-gpu-x86_64-pc-windows-msvc.exe"

          test -f "$CPU"
          test -f "$GPU"
          ls -l "$CPU" "$GPU"

          # The CPU binary has no Vulkan dependency, so it loads + runs here;
          # grepping our own flag confirms it's this build and executed.
          "$CPU" --help > help.txt 2>&1 || true
          grep -q -- "--no-gpu" help.txt

          echo "OK: CPU + Vulkan whisper-cli sidecars built on windows-latest."
