name: CI

# Fast correctness checks on every push to main and every PR. These do NOT
# bundle the app (that's release.yml on a tag), so they don't need the real
# sidecars — empty placeholders satisfy tauri-build's externalBin/resource
# existence checks, keeping CI quick.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential file patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri-build checks that externalBin + bundled resources exist even for a
      # plain `cargo check`. CI never bundles, so empty placeholders are enough.
      - name: Create sidecar / model placeholders
        run: |
          mkdir -p src-tauri/binaries src-tauri/resources/models
          for b in yt-dlp ffmpeg ffprobe whisper-cli sherpa-onnx-offline-speaker-diarization; do
            touch "src-tauri/binaries/$b-x86_64-unknown-linux-gnu"
          done
          touch src-tauri/resources/models/ggml-base.en.bin

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml
